<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Oliveira — Senior Full-Stack Software Engineer</title>
  <desc id="desc">Node.js, TypeScript and Python engineer focused on backend quality and AI-assisted development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18223d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="64" y="70" width="56" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="138" font-size="52" font-weight="700" fill="#f8fafc">Gabriel Oliveira</text>
    <text x="64" y="182" font-size="24" font-weight="500" fill="#cbd5e1">Senior Full-Stack Software Engineer</text>
    <text x="64" y="226" font-size="18" fill="#94a3b8">Node.js · TypeScript · Python · AI-assisted engineering</text>
  </g>

  <g transform="translate(720 72)">
    <rect width="416" height="156" rx="12" fill="#0f172a" stroke="#334155"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/>
    <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="20" r="5" fill="#34d399"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15">
      <text x="22" y="62" fill="#5eead4">$ <tspan fill="#e2e8f0">whoami --short</tspan></text>
      <text x="22" y="90" fill="#94a3b8">10+ yrs · backend first · tests that matter</text>
      <text x="22" y="114" fill="#94a3b8">RAG · MCP servers · Claude Code agents</text>
      <text x="22" y="138" fill="#94a3b8">Araras, SP · Brazil · remote</text>
    </g>
  </g>
</svg>
